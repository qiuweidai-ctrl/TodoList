<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#212529" />

    <!-- Practical 18, Step 5: default meta tags. React Helmet replaces the
         title/description per page at runtime. -->
    <meta
      name="description"
      content="A full-stack todo list built with Django REST Framework and React: sign up, add tasks, mark them complete and keep everything in sync."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="DAI QIUWEI" />

    <!-- Practical 18, Step 6: Open Graph / Twitter defaults for link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Todo App" />
    <meta property="og:title" content="Todo App | Django + React" />
    <meta
      property="og:description"
      content="A full-stack todo list built with Django REST Framework and React."
    />
    <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Todo App | Django + React</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
